description_long:
  zh: |-
    FoleyCrafter 把无声视频变成有现场感的成片：模型逐帧理解画面中的物体、动作与场景，自动生成与画面时间轴对齐的环境音、脚步声、碰撞声等音效，也支持只用文字描述生成音效。

    引擎同时做时间对齐与语义对齐，长镜头可分段处理，输出可直接与原视频合流。适合短片、广告、游戏过场、纪录片与二创素材补音。

    需要 NVIDIA GPU 与 torch >= 2.5.0，模型由引擎在首次运行时按需下载；显存占用随视频分辨率与时长大致线性增长。
  en: |-
    FoleyCrafter turns silent footage into finished scenes: the model understands objects, actions and environments frame by frame, then generates ambience, footsteps, impacts and other sound effects aligned to the timeline. Text-only sound-effect generation is supported as well.

    Both temporal and semantic alignment are applied, long shots can be processed in segments, and the output can be muxed back onto the original video. It suits short films, ads, game cutscenes, documentaries and remix material that needs foley.

    An NVIDIA GPU and torch >= 2.5.0 are required; model weights are downloaded on first run. VRAM usage grows roughly linearly with resolution and duration.
