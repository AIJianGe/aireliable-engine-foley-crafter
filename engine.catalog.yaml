  en: "FoleyCrafter"

description:
  zh: "FoleyCrafter 视频转音效引擎：为无声视频自动生成时间与语义对齐的环境音、动作音，也支持纯文本转音效。"
  en: "Video-to-audio Foley engine that generates time- and semantics-aligned sound effects for silent video, with text-to-audio support."

