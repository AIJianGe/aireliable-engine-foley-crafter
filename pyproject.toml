[project]
name = "foleycrafter-engine"
version = "1.0.0"
description = "AIReliable FoleyCrafter V2A Engine (video-to-audio + text-to-audio)"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "open-mmlab", url = "https://github.com/open-mmlab/FoleyCrafter" },
]
dependencies = [
    # ===== SDK（开发期 editable 模式） =====
    "aireliable-engine-sdk",
    # ===== Web 框架 =====
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "gradio>=4.0",
    # ===== 模型推理 =====
    "torch>=2.1.0",
    "torchvision",
    "diffusers>=0.27",
    "transformers>=4.40",
    "accelerate",
    "huggingface_hub",
    # ===== 视频处理 =====
    "moviepy>=1.0.3",
    # ===== 音频处理 =====
    "soundfile",
    "librosa",
    # ===== 数据模型 =====
    "pydantic>=2.0",
    # ===== 工具 =====
    "numpy",
    "Pillow",
]

[tool.uv.sources]
# 开发期：editable SDK 模式，确保 SDK 源码修改即时反映到引擎 .venv
# 禁用 git 依赖方式，避免覆盖本地修改
aireliable-engine-sdk = { path = "../../sdk/aireliable-engine-sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
